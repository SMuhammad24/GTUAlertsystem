name: GTU Circular Automation

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-circulars:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan GTU Circulars and Send Telegram Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORD_FILTER: ${{ secrets.KEYWORD_FILTER }}
          CHECK_INTERVAL_MINUTES: 15
        run: |
          python main.py --check

      - name: Commit and Push Database Changes
        run: |
          git config --global user.name "GTU-Bot-Automation"
          git config --global user.email "bot@gtu-automation.local"
          git add circulars.db web/data.json data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update circulars database & static feed [skip ci]" && git push)
